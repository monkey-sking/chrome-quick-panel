<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>书签 / 历史</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <nav class="mode-switch" aria-label="面板切换">
      <button type="button" class="mode-btn" id="mode-history" data-mode="history" aria-pressed="false">
        历史
      </button>
      <button type="button" class="mode-btn" id="mode-bookmarks" data-mode="bookmarks" aria-pressed="false">
        书签
      </button>
    </nav>

    <section class="view" id="history-view" hidden>
      <button type="button" class="row row-tall" id="history-open-page">
        <span class="row-icon" aria-hidden="true"></span>
        <span class="row-label">打开历史记录页面</span>
        <span class="kbd" id="history-shortcut">⌘Y</span>
      </button>
      <div class="rule"></div>
      <div class="section">
        <h2 class="section-title">您的设备</h2>
        <ul class="list" id="device-list"></ul>
      </div>
    </section>

    <section class="device-pane" id="device-pane" hidden>
      <div class="device-head">
        <span class="device-title" id="device-title"></span>
        <span class="row-time" id="device-time"></span>
      </div>
      <ul class="list device-tabs" id="device-tabs"></ul>
    </section>

    <section class="view" id="bookmarks-view" hidden>
      <div class="toolbar">
        <label class="search">
          <span class="row-icon" aria-hidden="true" id="search-icon"></span>
          <input id="bookmark-search" type="search" placeholder="搜索书签" autocomplete="off" spellcheck="false">
        </label>
        <button type="button" class="icon-btn" id="open-bookmark-manager" title="书签管理器"></button>
      </div>
      <div id="bookmark-body"></div>
    </section>
  </div>
  <script src="popup.js"></script>
</body>
</html>
